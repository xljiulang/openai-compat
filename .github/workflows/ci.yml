name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Pinned so a newly released rustc lint cannot turn the build red on its own.
  # Bump deliberately, together with any lint fixes the new toolchain requires.
  CI_TOOLCHAIN: "1.100"

jobs:
  check:
    name: lint, test and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CI toolchain
        run: rustup toolchain install ${{ env.CI_TOOLCHAIN }} --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +${{ env.CI_TOOLCHAIN }} fmt --all -- --check

      - name: Clippy (deny warnings and pedantic lints)
        run: cargo +${{ env.CI_TOOLCHAIN }} clippy --all-targets -- -D warnings -D clippy::pedantic

      - name: Test
        run: cargo +${{ env.CI_TOOLCHAIN }} test

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D missing_docs"
        run: cargo +${{ env.CI_TOOLCHAIN }} doc --no-deps

  test-windows:
    name: test on windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CI toolchain
        run: rustup toolchain install ${{ env.CI_TOOLCHAIN }} --profile minimal

      - name: Test
        run: cargo +${{ env.CI_TOOLCHAIN }} test

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.82 --profile minimal

      - name: Check against rust-version
        run: cargo +1.82 check --all-targets
